    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 32px 20px; line-height: 1.6; color: #3c3c3c">
        <h1 style="color: #46a302">🐻 Berli – die Vorschule-App</h1>
        <p>
          Berli, der Berliner Bär, macht Kinder von 5 bis 6 Jahren spielerisch fit für die Schule. Kurze Lektionen auf einem
          Lernpfad wie bei Duolingo, mit Serien, Kronen und Stickern. Alle Aufgaben werden vorgelesen – so können auch Kinder,
          die noch nicht lesen, allein spielen.
        </p>
        <h2>Was Berli übt</h2>
        <ul>
          <li>Buchstaben und Anlaute</li>
          <li>Buchstaben und Zahlen nachspuren – mit nummerierten Strichen in Schreibreihenfolge</li>
          <li>Zählen, Mengen vergleichen, Plus und Minus</li>
          <li>Uhrzeit, Wochentage und Jahreszeiten</li>
          <li>Reime und Silben klatschen</li>
          <li>Formen, Farben, Muster und Memory</li>
          <li>Mein Berlin und der sichere Schulweg</li>
        </ul>
        <h2>Gut zu wissen</h2>
        <ul>
          <li>Kostenlos, ohne Konto, ohne Werbung, ohne Tracking</li>
          <li>Funktioniert offline und lässt sich auf iPad, iPhone und Android zum Home-Bildschirm hinzufügen</li>
          <li>Auf Deutsch oder Italienisch – Eltern wählen die Sprache</li>
        </ul>
        <p><strong>Bitte JavaScript aktivieren, um Berli zu spielen.</strong></p>
        <p>Ein Projekt von <a href="https://meramie.cc/">Meramie</a> (Majd Hasan, Berlin).</p>
